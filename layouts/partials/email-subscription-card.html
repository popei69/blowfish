<div class="rounded-xl border border-neutral-200 dark:border-neutral-700 bg-neutral-100 dark:bg-neutral-800 p-6 sm:p-8">
  <h3 class="text-lg font-semibold text-neutral-900 dark:text-neutral mt-0 mb-2">Start your running journey</h3>
  <p class="text-sm text-neutral-500 dark:text-neutral-400 mt-0 mb-5">Practical tips, training insights, race reports, and honest failure analysis — sent when there is something worth sharing.</p>
  <form class="eo-form" novalidate>
    <div class="flex flex-col gap-3">
      <input
        type="email"
        name="email"
        placeholder="your@email.com"
        required
        autocomplete="email"
        class="w-full rounded border border-neutral-200 dark:border-neutral-600 bg-neutral dark:bg-neutral-700 px-3 py-2 text-sm text-neutral-900 dark:text-neutral placeholder-neutral-400 focus:outline-none focus:border-primary-500 dark:focus:border-primary-400"
      >
      <button
        type="submit"
        class="w-full rounded bg-primary-600 hover:bg-primary-500 px-4 py-2 text-sm font-medium text-neutral disabled:opacity-50 cursor-pointer"
      >Subscribe</button>
    </div>
    <p class="eo-msg mt-2 text-sm" style="display:none"></p>
  </form>
</div>
<script>
(function () {
  document.querySelectorAll('.eo-form:not([data-eo-init])').forEach(function (form) {
    form.setAttribute('data-eo-init', '1');
    var btn = form.querySelector('button[type="submit"]');
    var msg = form.querySelector('.eo-msg');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = form.querySelector('input[type="email"]').value;
      btn.disabled = true;
      msg.style.display = 'none';

      var bridge = document.getElementById('eo-bridge');
      var bridgeForm = bridge ? bridge.querySelector('form') : null;

      if (!bridgeForm) {
        showError('Something went wrong. Please try again.');
        return;
      }

      var emailField = bridgeForm.querySelector('input[type="email"]');
      if (emailField) emailField.value = email;

      function onSuccess() {
        observer.disconnect();
        clearTimeout(timer);
        try { localStorage.setItem('eo_subscribed', '1'); } catch (_) {}
        form.innerHTML = '<p class="text-sm text-neutral-500 dark:text-neutral-400 py-1">Subscribed. You\'ll hear from me when there\'s something worth sharing.</p>';
      }

      function showError(text) {
        observer.disconnect();
        clearTimeout(timer);
        msg.textContent = text;
        msg.className = 'eo-msg mt-2 text-sm text-red-500';
        msg.style.display = '';
        btn.disabled = false;
      }

      var observer = new MutationObserver(function () {
        var sEl = bridge.querySelector('.emailoctopus-success-message');
        var eEl = bridge.querySelector('.emailoctopus-error-message');
        var sText = sEl ? sEl.textContent.trim() : '';
        var eText = eEl ? eEl.textContent.trim() : '';

        if (sText) {
          onSuccess();
        } else if (eText) {
          if (eText.toLowerCase().includes('already')) {
            try { localStorage.setItem('eo_subscribed', '1'); } catch (_) {}
            showError('That email is already subscribed.');
          } else {
            showError('Something went wrong. Please try again.');
          }
        }
      });

      observer.observe(bridge, {
        childList: true,
        subtree: true,
        attributes: true,
        characterData: true,
        attributeFilter: ['style', 'class']
      });

      var timer = setTimeout(function () {
        showError('Something went wrong. Please try again.');
      }, 15000);

      var submitBtn = bridgeForm.querySelector('[type="submit"]');
      if (submitBtn) submitBtn.click();
    });
  });
})();
</script>
