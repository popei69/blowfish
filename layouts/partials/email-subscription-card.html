{{ $popup := .popup | default false }}
<div class="relative rounded-xl border border-neutral-200 dark:border-neutral-700 bg-neutral-100 dark:bg-neutral-800 p-6 sm:p-8">
  {{ if $popup }}
  <button
    class="eo-popup-close absolute top-3 right-3 p-1 rounded text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-200"
    aria-label="Close"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
  {{ end }}
  <h3 class="text-lg font-semibold text-neutral-900 dark:text-neutral mt-0 mb-2">Start your running journey</h3>
  <p class="text-sm text-neutral-500 dark:text-neutral-400 mt-0 mb-5">Practical tips, training insights, race reports, and honest failure analysis — sent when there is something worth sharing.</p>
  <form class="eo-form" novalidate>
    <div class="flex gap-2 flex-wrap">
      <input
        type="email"
        name="email"
        placeholder="your@email.com"
        required
        autocomplete="email"
        class="min-w-0 flex-1 rounded border border-neutral-200 dark:border-neutral-600 bg-neutral dark:bg-neutral-700 px-3 py-2 text-sm text-neutral-900 dark:text-neutral placeholder-neutral-400 focus:outline-none focus:border-primary-500 dark:focus:border-primary-400"
      >
      <input type="text" name="hp" style="display:none" tabindex="-1" autocomplete="off">
      <button
        type="submit"
        class="shrink-0 rounded bg-primary-600 hover:bg-primary-500 px-4 py-2 text-sm font-medium text-neutral disabled:opacity-50 cursor-pointer"
      >Subscribe</button>
    </div>
    <p class="eo-msg mt-2 text-sm" style="display:none"></p>
  </form>
</div>
<script>
(function () {
  var ENDPOINT = 'https://emailoctopus.com/lists/657ecea0-23b2-11ee-8f67-a33e250602f6/members/embedded/1.3/add';
  document.querySelectorAll('.eo-form:not([data-eo-init])').forEach(function (form) {
    form.setAttribute('data-eo-init', '1');
    var btn = form.querySelector('button[type="submit"]');
    var msg = form.querySelector('.eo-msg');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = form.querySelector('input[type="email"]').value;
      var hp = form.querySelector('input[name="hp"]').value;
      btn.disabled = true;
      msg.style.display = 'none';

      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ 'field[0]': email, hp: hp }).toString()
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.status === 'SUCCESS') {
            try { localStorage.setItem('eo_subscribed', '1'); } catch (_) {}
            form.innerHTML = '<p class="text-sm text-neutral-500 dark:text-neutral-400 py-1">Subscribed. You\'ll hear from me when there\'s something worth sharing.</p>';
          } else {
            var text = 'Something went wrong. Please try again.';
            if (data.error && data.error.code === 'MEMBER_EXISTS_WITH_EMAIL_ADDRESS') {
              text = 'That email is already subscribed.';
              try { localStorage.setItem('eo_subscribed', '1'); } catch (_) {}
            }
            msg.textContent = text;
            msg.className = 'eo-msg mt-2 text-sm text-red-500';
            msg.style.display = '';
            btn.disabled = false;
          }
        })
        .catch(function () {
          msg.textContent = 'Something went wrong. Please try again.';
          msg.className = 'eo-msg mt-2 text-sm text-red-500';
          msg.style.display = '';
          btn.disabled = false;
        });
    });
  });
})();
</script>
